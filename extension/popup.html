<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alterius</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="topbar">
      <img
        class="brand-logo"
        src="icons/icon-48.png"
        alt="Alterius"
        width="32"
        height="32"
      />
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input
          id="search"
          type="search"
          placeholder="検索"
          autocomplete="off"
        />
      </label>
      <div class="header-actions">
        <button
          id="open-settings"
          class="icon-button"
          type="button"
          aria-label="設定"
        >
          ⚙
        </button>
        <button
          id="show-create"
          class="icon-button primary-icon"
          type="button"
          aria-label="新規作成"
        >
          ＋
        </button>
      </div>
    </header>

    <form id="create-form" class="create-form" hidden>
      <label
        >サービス<input
          name="serviceName"
          required
          maxlength="120"
          placeholder="例: GitHub"
      /></label>
      <label
        >メモ<input name="note" maxlength="1000" placeholder="任意"
      /></label>
      <div class="form-actions">
        <button id="cancel-create" type="button">キャンセル</button>
        <button class="primary" type="submit">発行する</button>
      </div>
    </form>

    <section class="toolbar"><span>エイリアス</span></section>

    <main id="list" aria-live="polite"><p class="state">読み込み中…</p></main>
    <p id="toast" class="toast" role="status" hidden></p>

    <dialog id="edit-dialog">
      <form id="edit-form">
        <div class="dialog-head">
          <strong>エイリアスを編集</strong>
          <button
            id="close-edit"
            class="dialog-close"
            type="button"
            aria-label="閉じる"
          >
            ×
          </button>
        </div>
        <p id="edit-address" class="edit-address"></p>
        <label
          >サービス<input name="serviceName" required maxlength="120"
        /></label>
        <label>メモ<input name="note" maxlength="1000" /></label>
        <div class="form-actions">
          <button id="cancel-edit" type="button">キャンセル</button>
          <button class="primary" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="popup.js"></script>
  </body>
</html>
